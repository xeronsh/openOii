services:
  backend:
    image: ghcr.io/xeronsh/openoii-backend:latest
    env_file:
      - ./backend/.env
    environment:
      # 单文件 SQLite（WAL），持久化在 backend_data 卷
      DATABASE_URL: sqlite+aiosqlite:///./data/openoii.db
      # pi engine sidecar 与后端同容器（Dockerfile 里拷贝了 node + engine/）
      ENGINE_URL: http://127.0.0.1:18766
      # task_manager / confirm 依赖进程内状态，当前实现默认单 worker 才安全
      WEB_CONCURRENCY: "1"
      # 如果图像/视频服务也在 Docker 中，取消注释并修改为实际的容器名和端口
      # IMAGE_BASE_URL: http://your_image_service:port
      # VIDEO_BASE_URL: http://your_video_service:port
    ports:
      - "18765:18765"
    volumes:
      - ./backend/app/static:/app/app/static
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/xeronsh/openoii-frontend:latest
    depends_on:
      - backend
    ports:
      - "15173:15173"
    restart: unless-stopped

volumes:
  backend_data:
