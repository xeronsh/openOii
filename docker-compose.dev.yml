services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/openoii.db
      ENGINE_URL: http://127.0.0.1:18766
      WEB_CONCURRENCY: "1"
    ports:
      - "18765:18765"
    volumes:
      - ./backend/app/static:/app/app/static
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "15173:15173"
    restart: unless-stopped

volumes:
  backend_data:
